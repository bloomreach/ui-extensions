<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>BloomReach Bynder Extension Dialog</title>

    <style>
      body {
        margin: 0px;
      }

      #bynder {
        height: 100%;
        width: 100%;
        position:absolute;
      }
    </style>

    <script src="https://unpkg.com/@bloomreach/ui-extension@14.5.0/dist/ui-extension.min.js"></script>
    <script src="https://d8ejoa1fys2rk.cloudfront.net/5.0.5/modules/compactview/bynder-compactview-2-latest.js"></script>
  </head>
  <body>
    <div id="bynder"></div>
    <script>
      (ui => {

        function deserialize(value) {
          return (value && JSON.parse(value)) || [];
        }

        function serialize(value) {
          return value.length ? JSON.stringify(value) : '';
        }


        function toDatabaseId(value) {
          if (!value) return undefined;
          const hex = String(value).replace(/[^a-fA-F0-9]/g, '').toLowerCase();
          if (hex.length !== 32) return value;
          return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16)
            + '-' + hex.slice(16, 20) + '-' + hex.slice(20);
        }

        /**
         * We need to keep the old data format otherwise clients
         * would need to rewrite their code.
         *
         * NOTE: we created this based on a couple of examples (might need more tweaking)
         *
         *
         */
        function toOldFormat(asset) {
          // Already legacy (e.g. an asset loaded from an existing document).
          if (asset.thumbnails && !asset.files) {
            return asset;
          }

          const files = asset.files || {};
          const mini = files.mini || {};
          const webImage = files.webImage || {};
          const thumbnail = files.thumbnail || {};

          let orientation;
          if (webImage.width && webImage.height) {
            orientation = webImage.width > webImage.height ? 'landscape'
              : webImage.width < webImage.height ? 'portrait' : 'square';
          }

          const nodes = (asset.metaproperties && asset.metaproperties.nodes) || [];
          const extensionNode = nodes.find(node => node.name === 'extension');
          const extension = extensionNode
            ? (extensionNode.options || []).map(option => option.name)
            : undefined;

          return {
            id: asset.databaseId || asset.id,
            type: (asset.type || '').toLowerCase(),
            name: asset.name,
            description: asset.description || '',
            tags: asset.tags || [],
            orientation: orientation,
            extension: extension,
            datePublished: asset.publishedAt,
            dateCreated: asset.createdAt,
            dateModified: asset.updatedAt,
            thumbnails: {
              mini: mini.url,
              webimage: webImage.url,
              thul: thumbnail.url
            },
            original: asset.originalUrl || asset.url
          };
        }

        document.addEventListener('DOMContentLoaded', async () => {
          try {
            ui = await UiExtension.register();
            const options = await ui.dialog.options();
            const config = deserialize(ui.extension.config);
            const ids = deserialize(options.value)
              .map(item => toDatabaseId(item.databaseId || item.id))
              .filter(Boolean);

            BynderCompactView.open({
              container: document.getElementById('bynder'),
              portal: {url: config.dataDefaultEnvironment || '', editable: !config.dataDefaultEnvironment},
              language: config.language || "en_US",
              mode: config.mode || "SingleSelect",
              assetTypes: config.assetTypes || ['image'],
              selectedAssets: ids,
              onSuccess: function(assets, additionalInfo) {
                const normalized = assets.map(toOldFormat);
                if (additionalInfo.selectedFile !== undefined) Object.assign(normalized[0], {"selectedFile" : additionalInfo.selectedFile});
                ui.dialog.close(serialize(normalized));
              }
            });

          } catch(error) {
            console.error('Failed to register extension:', error.message);
            console.error('- error code:', error.code);
          }
        });

      })();
    </script>
  </body>
</html>
